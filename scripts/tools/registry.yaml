# 外部工具登记表 —— 收集到的工具都在这里，按需调用
#
# **为什么需要**：前几轮收集了上百个工具，但只写在文档里等于没有。
# 本表让每个工具变成**可调用、可检测、可降级**的能力。
#
# **⚠️ 身份校验（最重要的一条）**：
# `which sg` 命中的是 Unix 的 `sg`（set group ID）命令，它可执行但没有 `scan` 子命令
# —— 只查"命令存在"会得到**永远 0 命中却显示成功**的假工具。
# 所以每个工具必须配 `identity`：用 `--version` 输出特征 + 子命令双重校验。
#
# 缺失时行为：`degrade` 字段决定。
#   必需 → 标 confidence=low 并进 unknown
#   可选 → 标 skipped 并提示
# **任何情况下不得静默跳过。**

version: 1

# 校验命令模板：{exe} 会替换为可执行名
defaults:
  timeout: 120
  on_missing: "degrade        # degrade | fail | skip"

tools:

  # ---------- 文本排版（语义证据层 A）----------
  harfbuzz:
    name: HarfBuzz
    kind: cli
    repo: harfbuzz/harfbuzz
    license: MIT
    purpose: 文本 shaping 金标准（L1 字形簇合同：glyph/cluster/advance）
    exe: hb-shape
    identity:
      version_args: [--version]
      version_contains: [harfbuzz, HarfBuzz]
      subcommand: --help
    install:
      apt: apt-get install -y harfbuzz-bin
      brew: brew install harfbuzz
      pip: pip install uharfbuzz
    wrapper: tools/harfbuzz_shape.py
    produces: ledger/glyphs.json
    evidence_level: A
    degrade: required
    note: 自身不含 hinting；hinted rasterization 交给 FreeType/Skrifa

  freetype:
    name: FreeType
    kind: cli
    repo: freetype/freetype2
    license: FTL/GPLv2+
    purpose: hinting / gamma / LCD filter / stem darkening → 字形外观
    exe: freetype-config
    identity:
      version_args: [--version]
      version_contains: [freetype]
    install:
      apt: apt-get install -y libfreetype6-dev
    produces: font_lock 证据
    evidence_level: B
    degrade: optional

  # ---------- 树对齐与差异（A/C）----------
  gumtree:
    name: GumTree
    kind: cli
    repo: GumTreeDiff/gumtree
    license: AGPL-3.0（**注意：AGPL，商业项目需法务确认**）
    purpose: 树 diff，识别 move / rename / insert / delete（L3 结构细化）
    exe: gumtree
    identity:
      version_args: [--version]
      version_contains: [gumtree, GumTree]
      subcommand: difftree
    install:
      manual: 下载 https://github.com/GumTreeDiff/gumtree/releases
    wrapper: tools/gumtree_diff.py
    produces: ledger/tree_edit_ops.json
    evidence_level: A
    degrade: optional
    note: 借鉴三阶段算法；语言 parser 与 UI 树非一一对应，不原样当真值

  apted:
    name: APTED
    kind: cli
    repo: DatabaseGroup/apted
    license: MIT
    purpose: 树编辑距离与 node mapping（L4，仅未匹配连通块）
    exe: python3
    identity:
      version_args: [-c, "import apted; print('APTED_OK')"]
      version_contains: [APTED_OK]
    install:
      pip: pip install apted
    produces: 编辑距离与映射
    evidence_level: A
    degrade: optional

  odiff:
    name: odiff
    kind: cli
    repo: dmtrKovalenko/odiff
    license: MIT
    purpose: 图像 diff，抗锯齿识别 / 区域忽略 / YIQ 阈值
    exe: odiff
    identity:
      version_args: [--version]
      subcommand: --help
    install:
      npm: npm i -g odiff-bin
    wrapper: tools/odiff_image.py
    produces: ledger/image_diff.json
    evidence_level: B
    degrade: optional
    note: "**抗锯齿忽略是候选分类，不是默认豁免**"

  # ---------- 不变量与差分（B/C）----------
  daikon:
    name: Daikon
    kind: cli
    repo: plse-cs-uw/daikon
    license: MIT（BSD 风格）
    purpose: 动态不变量检测 —— 原版运行时值序列 → 候选不变量清单
    exe: java -cp daikon.jar daikon.Daikon
    identity:
      version_args: [--version]
      version_contains: [daikon, Daikon]
    install:
      manual: https://plse.cs.washington.edu/daikon/download/
    wrapper: tools/daikon_invariants.py
    produces: ledger/invariants.txt
    evidence_level: A
    degrade: optional
    note: "**输出是候选不是证明**；须以驱动覆盖率为置信度分母"
    related:
      celeriac: codespecs/daikon-dot-net-front-end（.NET 前端，C#/F#/VB）

  difftest:
    name: difftest
    kind: cli
    repo: nalediym/difftest
    license: MIT
    purpose: 同输入跑两程序，比对 stdout/exit/stderr
    exe: difftest
    identity:
      version_args: [--version]
    install:
      cargo: cargo install difftest
    produces: 成对输出 diff
    evidence_level: A
    degrade: optional

  # ---------- 网络与故障注入（C）----------
  toxiproxy:
    name: Toxiproxy
    kind: cli
    repo: Shopify/toxiproxy
    license: MIT
    purpose: 传输层故障注入 latency/down/timeout/slicer/limit_data…
    exe: toxiproxy-server
    identity:
      version_args: [--version]
    install:
      brew: brew install shopify/shopify/toxiproxy
      go: go install github.com/Shopify/toxiproxy/cmd/toxiproxy-server@latest
    wrapper: tools/toxiproxy_fault.py
    produces: ledger/network_faults.json
    evidence_level: A
    degrade: optional
    note: "**不能**模拟 NTFS ACL、磁盘配额、独占锁、COM；那是 Detours/IO shim 的活"

  mitmproxy:
    name: mitmproxy
    kind: cli
    repo: mitmproxy/mitmproxy
    license: MIT
    purpose: HTTP/1/2/WS 拦截、录制、重放、addon 故障注入（内容层）
    exe: mitmproxy
    identity:
      version_args: [--version]
      version_contains: [mitmproxy]
    install:
      pip: pip install mitmproxy
    produces: captures/*.flow
    evidence_level: A
    degrade: optional
    note: 与 Toxiproxy 分层 —— **互相不能替代**

  libfiu:
    name: libfiu
    kind: cli
    repo: blitiri/libfiu
    license: MIT/BSD
    purpose: POSIX 故障注入，LD_PRELOAD + errno，fiu-ctrl 运行时启停
    exe: fiu-run
    identity:
      version_args: [--version]
    install:
      apt: apt-get install -y fiu-utils
    wrapper: tools/fiu_fault.py
    produces: ledger/posix_faults.json
    evidence_level: A
    degrade: optional
    note: 仅 Linux/macOS；Windows 端用 Detours 或自有 IO shim 建等价层

  # ---------- 原版取证（S0）----------
  flaui:
    name: FlaUI
    kind: cli
    repo: FlaUI/FlaUI
    license: MIT
    purpose: 原版 WPF 控件树驱动（UIA 封装）
    exe: dotnet
    identity:
      version_args: [--version]
      version_contains: [dotnet, ., NET]
    install:
      manual: NuGet FlaUI（Windows）
    produces: original_capture/<state_id>.uia.json
    evidence_level: A
    degrade: required
    note: 与 pywinauto 不一致 → 标 tree_conflict，**不自动选边**

  pywinauto:
    name: pywinauto
    kind: cli
    repo: pywinauto/pywinauto
    license: BSD-3
    purpose: 原版驱动交叉验证
    exe: python3
    identity:
      version_args: [-c, "import pywinauto; print('PYWINAUTO_OK')"]
      version_contains: [PYWINAUTO_OK]
    install:
      pip: pip install pywinauto
    produces: 控件树（交叉验证）
    evidence_level: B
    degrade: optional

  ilspycmd:
    name: ilspycmd
    kind: cli
    repo: icsharpcode/ILSpy
    license: MIT
    purpose: .NET 反编译（**源码不全才启用**）
    exe: ilspycmd
    identity:
      version_args: [--version]
      version_contains: [ilspy, ILSpy]
    install:
      dotnet: dotnet tool install -g ilspycmd
    produces: 反编译源码
    evidence_level: B
    degrade: optional
    note: "**仅限合法拥有且授权的目标**；遇加密/DRM/许可证校验停止并咨询法务"

  # ---------- 图像与资源（F）----------
  resvg:
    name: resvg
    kind: cli
    repo: linebender/resvg
    license: MPL-2.0（**注意：非 MIT**）
    purpose: SVG 确定性位图渲染
    exe: resvg
    identity:
      version_args: [--version]
    install:
      cargo: cargo install resvg
    wrapper: tools/resvg_render.py
    produces: 基准位图（须记版本/DPI/背景/CSS/shaping 后端）
    evidence_level: A
    degrade: optional

  imagemagick:
    name: ImageMagick
    kind: cli
    repo: ImageMagick/ImageMagick
    license: ImageMagick License
    purpose: 图像转换、ICO 生成、比对
    exe: magick
    identity:
      version_args: [--version]
      version_contains: [ImageMagick]
    install:
      apt: apt-get install -y imagemagick
    produces: 转换产物
    evidence_level: C
    degrade: optional

  # ---------- 视频与动效 ----------
  vmaf:
    name: VMAF
    kind: cli
    repo: Netflix/vmaf
    license: BSD-2
    purpose: 感知视频质量（VIF/ADM/Motion/SSIM/MS-SSIM/CIEDE2000）
    exe: vmaf
    identity:
      version_args: [--version]
    install:
      manual: 需编译 FFmpeg --enable-libvmaf
    wrapper: tools/vmaf_quality.py
    produces: 逐帧质量序列
    evidence_level: B
    degrade: optional
    note: 回答"看起来多像"，**不能定位缺失按钮或错误焦点顺序**

  ffmpeg:
    name: FFmpeg
    kind: cli
    repo: FFmpeg/FFmpeg
    license: LGPL/GPL
    purpose: 抽帧、时间基对齐、转码
    exe: ffmpeg
    identity:
      version_args: [-version]
      version_contains: [ffmpeg]
    install:
      apt: apt-get install -y ffmpeg
    produces: 帧集
    evidence_level: A
    degrade: optional

  # ---------- 私有格式（E）----------
  kaitai:
    name: Kaitai Struct
    kind: cli
    repo: kaitai-io/kaitai_struct
    license: GPLv3（compiler）/ MIT（runtime 部分）
    purpose: 声明式 .ksy → 多语言 parser；私有格式考古
    exe: ksc
    identity:
      version_args: [--version]
    install:
      manual: https://kaitai.io/#download
    wrapper: tools/kaitai_probe.py
    produces: 解析结果 + round-trip 校验
    evidence_level: A
    degrade: optional
    note: 验收要求 **round-trip 与原字节相等**；证据不足标 schema_inferred

  # ---------- 崩溃（E）----------
  minidump_stackwalk:
    name: rust-minidump
    kind: cli
    repo: rust-minidump/rust-minidump
    license: MIT/Apache-2.0
    purpose: minidump 解析与符号化
    exe: minidump-stackwalk
    identity:
      version_args: [--version]
    install:
      cargo: cargo install minidump-stackwalk
    wrapper: tools/minidump_crash.py
    produces: 归一化崩溃签名
    evidence_level: B
    degrade: optional
    note: "**不比调用栈**（跨语言无相同函数）；比签名/阶段/输入/状态/恢复"

  # ---------- 代码查询（S2M）----------
  ast_grep:
    name: ast-grep
    kind: cli
    repo: ast-grep/ast-grep
    license: MIT
    purpose: AST 精确查询（补正则的漏）
    exe: sg
    identity:
      version_args: [--version]
      version_contains: [ast-grep]
      subcommand: scan
    install:
      cargo: cargo install ast-grep
      npm: npm i -g @ast-grep/cli
    wrapper: (已有 scripts/ast_query.py)
    produces: ledger/findings.json
    evidence_level: A
    degrade: optional
    note: ⚠️ **Unix 自带 `sg`（set group ID）命令会冒充** —— 必须校验身份

  semgrep:
    name: Semgrep
    kind: cli
    repo: semgrep/semgrep
    license: LGPL-2.1
    purpose: 语义模式查询
    exe: semgrep
    identity:
      version_args: [--version]
      version_contains: [semgrep]
    install:
      pip: pip install semgrep
    produces: 查询结果
    evidence_level: B
    degrade: optional

  jscpd:
    name: jscpd
    kind: cli
    repo: kucherenko/jscpd
    license: MIT
    purpose: 多语言克隆检测（Type-1/2/3）
    exe: jscpd
    identity:
      version_args: [--version]
    install:
      npm: npm i -g jscpd
    wrapper: tools/jscpd_clone.py
    produces: ledger/clones.json
    evidence_level: B
    degrade: optional
    note: 目标是**发现历史分叉**，不是单纯删重复；单一哈希不得决定合并

  # ---------- 安装与打包（D）----------
  velopack:
    name: Velopack
    kind: cli
    repo: velopack/velopack
    license: MIT
    purpose: Windows 安装包与更新（比 Omaha 更适合复刻）
    exe: vpk
    identity:
      version_args: [--version]
    install:
      dotnet: dotnet tool install -g vpk
    produces: 安装包 + Update.exe
    evidence_level: B
    degrade: optional

  wix:
    name: WiX Toolset
    kind: cli
    repo: wixtoolset/wix
    license: MS-RL / WiX 许可
    purpose: "**安装契约源码**（不是临时打包脚本）"
    exe: wix
    identity:
      version_args: [--version]
    install:
      dotnet: dotnet tool install -g wix
    produces: MSI
    evidence_level: B
    degrade: optional
    note: 开始菜单 shortcut 需 Shortcut + RemoveFolder + KeyPath，否则卸载残留

  # ---------- 编排与可复现（第七轮 A）----------
  taskfile:
    name: Task
    kind: cli
    repo: go-task/task
    license: MIT
    purpose: 任务编排（比 Make 易读，比 Bazel 轻）
    exe: task
    identity:
      version_args: [--version]
      version_contains: [Task, task]
      subcommand: --list
    install:
      brew: brew install go-task/tap/go-task
    produces: 可复现流水线
    evidence_level: C
    degrade: optional
    note: ⚠️ 某些发行版有同名 `task`（taskwarrior）—— 必须校验身份

  mise:
    name: mise-en-place
    kind: cli
    repo: jdx/mise
    license: MIT
    purpose: 工具版本固定（比 asdf 快，支持 .mise.toml）
    exe: mise
    identity:
      version_args: [--version]
      version_contains: [mise]
    install:
      brew: brew install mise
    produces: 锁定工具版本
    evidence_level: C
    degrade: optional

  duckdb:
    name: DuckDB
    kind: cli
    repo: duckdb/duckdb
    license: MIT
    purpose: 证据检索层 —— 上万条 JSON/CSV 直接 SQL 查询
    exe: duckdb
    identity:
      version_args: [--version]
      version_contains: [DuckDB, duckdb, v]
    install:
      pip: pip install duckdb
    wrapper: tools/duckdb_evidence.py
    produces: 证据查询与对账
    evidence_level: C
    degrade: optional
    note: 嵌入式、零依赖；比 SQLite 更适合"直接查 Parquet/CSV/JSON"

  sqlite_fts:
    name: SQLite FTS5
    kind: cli
    repo: sqlite/sqlite
    license: Public Domain
    purpose: 全文检索证据（文案、BUG、unknown）
    exe: sqlite3
    identity:
      version_args: [--version]
      version_contains: [SQLite]
    install:
      apt: apt-get install -y sqlite3
    produces: 证据索引
    evidence_level: C
    degrade: optional

  cosign:
    name: cosign
    kind: cli
    repo: sigstore/cosign
    license: Apache-2.0
    purpose: 产物签名（golden、安装包、证据包）
    exe: cosign
    identity:
      version_args: [version]
      subcommand: sign
    install:
      go: go install github.com/sigstore/cosign/v2/cmd/cosign@latest
    produces: 签名与验证
    evidence_level: A
    degrade: optional
    note: 与 Rekor 透明日志配合 → 签字可追溯、不可抵赖

  # ---------- 差异报告与可视化（第七轮 D）----------
  difftastic:
    name: difftastic
    kind: cli
    repo: Wilfred/difftastic
    license: MIT
    purpose: 语法感知 diff（比行级 diff 少大量噪声）
    exe: difft
    identity:
      version_args: [--version]
      version_contains: [difftastic]
    install:
      cargo: cargo install difftastic
    produces: 结构化 diff
    evidence_level: C
    degrade: optional
    note: 呼应"Myers/Unified 行级 diff 对重排/移动产生噪声"的拒绝项

  # ---------- 多模态（第七轮 F）----------
  tesseract:
    name: Tesseract OCR
    kind: cli
    repo: tesseract-ocr/tesseract
    license: Apache-2.0
    purpose: 从截图反推文案（**拿不到源码时的候选证据**）
    exe: tesseract
    identity:
      version_args: [--version]
      version_contains: [tesseract]
    install:
      apt: apt-get install -y tesseract-ocr
    wrapper: tools/ocr_text.py
    produces: 候选文案
    evidence_level: C
    degrade: optional
    note: ⚠️ **OCR 结果只能作候选**，不能替代源码文案清单；须人工确认

  # ---------- 编排与环境（第七轮 A，续）----------
  devbox:
    name: Devbox
    kind: cli
    repo: jetify-com/devbox
    license: Apache-2.0
    purpose: 宿主外工具与服务隔离（Nix 的友好包装）
    exe: devbox
    identity:
      version_args: [version]
      version_contains: [devbox]
    install:
      manual: curl -fsSL https://get.jetify.com/devbox | bash
    produces: devbox.json / 隔离 shell
    evidence_level: C
    degrade: optional
    note: 语言运行时用 mise，**宿主外工具与服务**用 devbox；Nix 仍负责二进制级可复现，不被替换

  earthly:
    name: Earthly
    kind: cli
    repo: earthly/earthly
    license: MPL-2.0（**非 MIT**）
    purpose: 容器化隔离构建/度量步骤
    exe: earthly
    identity:
      version_args: [--version]
      version_contains: [earthly]
    install:
      brew: brew install earthly
    produces: Earthfile 目标与产物
    evidence_level: C
    degrade: optional
    note: 只接管**需要干净容器**的步骤（Windows UI 采集、字体渲染、ICU/时区、视频编码）

  # ---------- 签字与不可抵赖（第七轮 C）----------
  rekor:
    name: Rekor
    kind: cli
    repo: sigstore/rekor
    license: Apache-2.0
    purpose: 透明日志 —— 签字可追溯、不可抵赖
    exe: rekor
    identity:
      version_args: [version]
      subcommand: verify
    install:
      go: go install github.com/sigstore/rekor/cmd/rekor-cli@latest
    produces: 透明日志条目（含 inclusion proof）
    evidence_level: A
    degrade: optional
    note: 签的是 **manifest digest**，不是"某个看起来相同的网页"；任一证据哈希变化则签名失效

  immudb:
    name: immudb
    kind: cli
    repo: codenotary/immudb
    license: Apache-2.0
    purpose: 防篡改只增数据库（不信任存储或不能共用公网 Rekor 时）
    exe: immudb
    identity:
      version_args: [version]
    install:
      manual: https://docs.immudb.io/
    produces: 带密码学证明的状态
    evidence_level: A
    degrade: optional
    note: 仅少量关键批准用 cosign+rekor 即可；批准事件持续进入内部系统才上 immudb

  git_appraise:
    name: git-appraise
    kind: cli
    repo: google/git-appraise
    license: Apache-2.0
    purpose: 离线评审历史（Git notes 存储，无需服务器）
    exe: git-appraise
    identity:
      version_args: [--help]
    install:
      go: go install github.com/google/git-appraise@latest
    produces: 评审记录
    evidence_level: C
    degrade: optional
    note: ⚠️ 最新发布停留在 2021，且 accept 不提供签名/防删除 —— **只作历史记录层**，不能单独承担防抵赖

  # ---------- 报告（第七轮 D）----------
  allure:
    name: Allure Report
    kind: cli
    repo: allure-framework/allure2
    license: Apache-2.0
    purpose: 可归档的逐张视觉验收报告（step/timing/attachment/metadata）
    exe: allure
    identity:
      version_args: [--version]
      version_contains: [allure]
    install:
      brew: brew install allure
    produces: 静态 HTML 报告
    evidence_level: C
    degrade: optional
    note: 比自建 Markdown 更适合承载"逐控件/逐状态/逐视口"的证据；**报告与附件目录分离**

  vitepress:
    name: VitePress
    kind: cli
    repo: vuejs/vitepress
    license: MIT
    purpose: 报告静态站点（base 可设相对路径，产物可迁移）
    exe: vitepress
    identity:
      version_args: [--version]
    install:
      npm: npm i -D vitepress
    produces: 静态站点
    evidence_level: C
    degrade: optional
    note: 大型交互站才用 Docusaurus；**报告只引用内容寻址附件**，禁止把数 GB 截图编码进 HTML

  # ---------- 多模态与数据（第七轮 E/F/G）----------
  rrweb:
    name: rrweb
    kind: cli
    repo: rrweb-io/rrweb
    license: MIT
    purpose: Web 端会话录制与回放（**仅复刻后的 WebView**）
    exe: python3 -c "print('rrweb 是 JS 库，非 CLI')"
    identity:
      version_args: [-c, "print('RRWEB_INFO')"]
      version_contains: [RRWEB_INFO]
    install:
      npm: npm i rrweb
    produces: 事件流
    evidence_level: C
    degrade: optional
    note: ⚠️ **rrweb 不能直接录制 Win32/WPF** —— 原版证据仍靠 FlaUI 自动化日志

  presidio:
    name: Microsoft Presidio
    kind: cli
    repo: microsoft/presidio
    license: MIT
    purpose: PII 识别与脱敏（测试真实数据前的降风险手段）
    exe: python3
    identity:
      version_args: [-c, "import presidio_analyzer; print('PRESIDIO_OK')"]
      version_contains: [PRESIDIO_OK]
    install:
      pip: pip install presidio-analyzer presidio-anonymizer
    produces: 脱敏映射与验证报告
    evidence_level: C
    degrade: optional
    note: ⚠️ 官方明确**不能保证找出全部 PII**；须走"自动识别→人工复核→替换→签名"流程

  faker:
    name: Faker
    kind: cli
    repo: joke2k/faker
    license: MIT
    purpose: 合成测试数据（姓名/地址/日期/路径）
    exe: python3
    identity:
      version_args: [-c, "import faker; print('FAKER_OK')"]
      version_contains: [FAKER_OK]
    install:
      pip: pip install faker
    produces: 合成数据
    evidence_level: C
    degrade: optional
    note: 合成分布**不能证明**原版对边界值/历史脏数据/本地化格式的行为正确

  weblate:
    name: Weblate
    kind: cli
    repo: WeblateOrg/weblate
    license: GPLv3
    purpose: 翻译协作与评审（**不是自动翻译**）
    exe: weblate
    identity:
      version_args: [--version]
    install:
      manual: https://docs.weblate.org/
    produces: 翻译与评审记录
    evidence_level: C
    degrade: optional
    note: 文案复刻应**先做结构化清单**；伪本地化须用确定性脚本，**不能用 LLM 改写替代原文证据**

  # ================= 游戏引擎复刻（新增场景）=================
  # 注：游戏场景的核心差异是"确定性 + GPU + 固定时间步"，
  #     以下工具都服务于"把不可见状态变成验收对象"。

  # ---------- A 确定性 / 回放 / desync ----------
  libtas:
    name: libTAS
    kind: cli
    repo: clementgallet/libTAS
    license: GPLv3
    purpose: "**原生 Linux 游戏**确定性录制回放（LD_PRELOAD 注入，帧边界同步输入）"
    exe: libTAS
    identity:
      version_args: [--version]
      version_contains: [libTAS]
    install:
      apt: apt-get install -y libtas
    wrapper: (见 scripts/game_replay.py)
    produces: .ltm 影片（配置+输入+元数据）、savestate、逐帧推进
    evidence_level: A
    degrade: optional
    note: "拦截 XCB/SDL/Xlib、OpenGL、Vulkan、ALSA、**时钟**、线程、文件操作； 初始系统时间写进影片。⚠️ 回放失败≠游戏逻辑错误，可能是注入/驱动/容器问题"

  bizhawk:
    name: BizHawk
    kind: cli
    repo: TASEmulators/BizHawk
    license: MIT
    purpose: 多系统模拟器，输入录制/无限 savestate/逐帧编辑(TAStudio)/Lua 脚本
    exe: EmuHawk
    identity:
      version_args: [--version]
    install:
      manual: https://tasvideos.org/BizHawk/ReleaseHistory
    produces: 影片 + 内存状态
    evidence_level: A
    degrade: optional
    note: 价值在**可重录与平台级确定性**，不只是多模拟器；回放依赖精确核心+机器状态+输入+起始条件

  ggpo:
    name: GGPO
    kind: reference
    repo: poncet/ggpo
    license: MIT
    purpose: 回滚网络 —— **确定性要求的完整工程表达**
    exe: (库，非 CLI)
    identity:
      version_args: [--version]
    install:
      manual: https://github.com/pond3r/ggpo
    produces: 网络同步
    evidence_level: A
    degrade: optional
    note: 要求 save/load_game_state + advance_frame。**即使不做联网也应实现同样的本地回放与重模拟**

  jolt:
    name: Jolt Physics
    kind: reference
    repo: jrouwe/JoltPhysics
    license: MIT
    purpose: 确定性物理（含 `CROSS_PLATFORM_DETERMINISTIC` 与 Check Determinism 模式）
    exe: (库，非 CLI)
    identity:
      version_args: [--version]
    install:
      manual: https://github.com/jrouwe/JoltPhysics
    produces: 物理状态（可 SaveState）
    evidence_level: A
    degrade: optional
    note: "⚠️ 跨编译器/OS/架构需**相同源码定义+precise 模式+一致 FPU/DAZ/FTZ+Sin/Cos+排序哈希**； **SaveState 只记物理修改的位置速度** —— 摩擦改动/增删物体/约束触发须自行恢复"

  box2d:
    name: Box2D
    kind: reference
    repo: erincatto/box2d
    license: MIT
    purpose: 2D 物理，官方给出跨平台确定性条件
    exe: (库，非 CLI)
    identity:
      version_args: [--version]
    install:
      manual: https://github.com/erincatto/box2d
    produces: 物理状态
    evidence_level: B
    degrade: optional
    note: "避免 fast-math、关 FMA（`-ffp-contract=off`）、替换平台不同 `atan2f`； 三角函数仍须谨慎"

  # ---------- B GPU 渲染取证 ----------
  renderdoc:
    name: RenderDoc
    kind: cli
    repo: baldurk/renderdoc
    license: MIT
    purpose: "**交互式单帧取证**（原版渲染事实源）"
    exe: renderdoccmd
    identity:
      version_args: [--version]
      version_contains: [renderdoc, RenderDoc]
      subcommand: capture
    install:
      apt: apt-get install -y renderdoc
    wrapper: (见 scripts/game_render.py)
    produces: .rdc 帧捕获（可跨平台共享）
    evidence_level: A
    degrade: required
    note: 支持 Vulkan/D3D11-12/GL-ES；有 Python 接口。F12 捕获下一帧

  gfxreconstruct:
    name: GFXReconstruct
    kind: cli
    repo: LunarG/gfxreconstruct
    license: Apache-2.0
    purpose: Vulkan layer / D3D12 录制 API 调用 → `.gfxr` **可重放**（CI 首选）
    exe: gfxrecon-capture
    identity:
      version_args: [--version]
      version_contains: [gfxrecon]
    install:
      manual: https://github.com/LunarG/gfxreconstruct
    produces: .gfxr（可 info/compress/extract SPIR-V/convert JSONL）
    evidence_level: A
    degrade: optional
    note: "**自动化回放首选**，与 RenderDoc 互补（后者偏交互式单帧分析）"

  apitrace:
    name: apitrace
    kind: cli
    repo: apitrace/apitrace
    license: MIT
    purpose: 老 OpenGL/D3D 工作流 API 录制回放，可脚本化 diff、无头测试
    exe: apitrace
    identity:
      version_args: [--version]
    install:
      apt: apt-get install -y apitrace
    produces: .trace
    evidence_level: B
    degrade: optional
    note: ⚠️ 帧内资源检查不如 RenderDoc，**不得冒充 RenderDoc**

  spirv_cross:
    name: SPIRV-Cross
    kind: cli
    repo: KhronosGroup/SPIRV-Cross
    license: Apache-2.0
    purpose: SPIR-V 反转为可读 GLSL/MSL/HLSL 与 C++ 反射 JSON
    exe: spirv-cross
    identity:
      version_args: [--version]
      version_contains: [SPIRV-Cross]
    install:
      manual: https://github.com/KhronosGroup/SPIRV-Cross
    produces: 可读着色器 + 反射
    evidence_level: A
    degrade: optional
    note: 着色器取证要**从字节流回到可读语义**；记 dxc/FXC 版本、优化级别、签名

  mesa_llvmpipe:
    name: Mesa llvmpipe / lavapipe
    kind: cli
    repo: mesa/mesa
    license: MIT
    purpose: "**软件渲染基线**（消除 GPU 噪声）"
    exe: glxinfo
    identity:
      version_args: [-B]
      version_contains: [mesa, Mesa, OpenGL]
    install:
      apt: apt-get install -y mesa-utils libgl1-mesa-dri
    produces: 可重复渲染结果
    evidence_level: A
    degrade: required
    note: "没有软渲染基线就**无法区分游戏错误与驱动/GPU 差异**； llvmpipe=GL，lavapipe=Vulkan"

  # ---------- C 匹配式反编译 ----------
  decompme:
    name: decomp.me
    kind: reference
    repo: decompme/decomp.me
    license: MIT
    purpose: 协作式**函数匹配**服务（重编译并用 objdump 比较指令，给匹配分数）
    exe: (Web 服务 + CLI 导出)
    identity:
      version_args: [--help]
    install:
      manual: https://decomp.me
    produces: matching / non-matching 状态与匹配率
    evidence_level: A
    degrade: optional
    note: ⚠️ matching=生成汇编一致；**equivalent 只有语义测试/形式化边界/契约证据充分时才用**

  splat:
    name: splat
    kind: cli
    repo: decompals/splat
    license: MIT
    purpose: 二进制切分，输出符号/段/目标汇编/上下文
    exe: splat
    identity:
      version_args: [--help]
    install:
      pip: pip install splat64
    produces: 汇编与符号
    evidence_level: A
    degrade: optional
    note: "当前明确支持 **N64 / PSX / PS2 / PSP**；GameCube/Wii 应转 decomp-toolkit， **不应把 splat 宣称成通用方案**"

  reccmp:
    name: reccmp
    kind: cli
    repo: isledecomp/reccmp
    license: AGPL-3.0（**注意**）
    purpose: 原版二进制 vs 重编译二进制，比对函数/全局数据/栈布局/vtable/导出
    exe: reccmp
    identity:
      version_args: [--help]
    install:
      manual: https://github.com/isledecomp/reccmp
    produces: 匹配率报告
    evidence_level: A
    degrade: optional
    note: "⚠️ 明确支持 **32 位 x86 + 旧版 MSVC（如 4.20）**；新版 MSVC 开发中， 其他编译器/语言/架构暂不支持 —— **不许误称支持 IL2CPP/Unreal/ARM**"

  decomp_permuter:
    name: decomp-permuter
    kind: cli
    repo: simonlindholm/decomp-permuter
    license: MIT
    purpose: 自动生成候选 C 代码变体，汇编并比较输出（95-99% 匹配时找寄存器分配/声明顺序）
    exe: permuter
    identity:
      version_args: [--help]
    install:
      manual: https://github.com/simonlindholm/decomp-permuter
    produces: 候选变体
    evidence_level: B
    degrade: optional
    note: "**是搜索器不是最终证明**；不应把在线服务或随机搜索结果当单一事实源"

  # ---------- D 资产提取 ----------
  quickbms:
    name: QuickBMS
    kind: cli
    repo: (官方站点分发，非 GitHub 主仓)
    license: 闭源免费工具 / 脚本引擎
    purpose: "**通用游戏归档提取**（脚本驱动，覆盖大量格式）"
    exe: quickbms
    identity:
      version_args: [--help]
    install:
      manual: https://aluigi.altervista.org/quickbms.htm
    produces: 提取结果
    evidence_level: B
    degrade: optional
    note: ⚠️ 每个版本/加密/压缩/平台都可能失效 —— **只作兜底**，不作事实源

  assetripper:
    name: AssetRipper
    kind: cli
    repo: AssetRipper/AssetRipper
    license: GPLv3
    purpose: Unity 资产与 AssetBundle 恢复
    exe: AssetRipper
    identity:
      version_args: [--version]
    install:
      manual: https://github.com/AssetRipper/AssetRipper/releases
    produces: Unity 资产
    evidence_level: B
    degrade: optional

  cue4parse:
    name: CUE4Parse
    kind: reference
    repo: FabianFG/CUE4Parse
    license: Apache-2.0
    purpose: UE4/UE5 归档、包、纹理、网格、动画、音频解析
    exe: (库 / FModel 前端)
    identity:
      version_args: [--version]
    install:
      manual: https://github.com/FabianFG/CUE4Parse
    produces: UE 资产
    evidence_level: B
    degrade: optional
    note: FModel（GPLv3）是基于它的浏览器；**umodel/FModel 是提取器不是反编译器**

  il2cppdumper:
    name: Il2CppDumper
    kind: cli
    repo: Perfare/Il2CppDumper
    license: MIT
    purpose: 从 libil2cpp.so + 元数据恢复类型、字符串、方法表
    exe: Il2CppDumper
    identity:
      version_args: [--version]
    install:
      manual: https://github.com/Perfare/Il2CppDumper
    produces: 类型与符号
    evidence_level: A
    degrade: optional
    note: 现代 Unity IL2CPP 的重点路径；MelonLoader/BepInEx 是运行时加载器，不作离线事实源

  gdsdecomp:
    name: gdsdecomp
    kind: cli
    repo: bruvzg/gdsdecomp
    license: GPLv3
    purpose: Godot PCK / GDNative / GDExtension 与脚本恢复
    exe: gdsdecomp
    identity:
      version_args: [--help]
    install:
      manual: https://github.com/bruvzg/gdsdecomp
    produces: Godot 资产与脚本
    evidence_level: B
    degrade: optional

  undertalemodtool:
    name: UndertaleModTool
    kind: cli
    repo: UnderminersTeam/UndertaleModTool
    license: GPLv3
    purpose: "GameMaker: Studio 1.4 与 GMS2 bytecode 13-17；可重建**字节级精确副本**并反汇编"
    exe: UndertaleModTool
    identity:
      version_args: [--version]
    install:
      manual: https://github.com/UnderminersTeam/UndertaleModTool
    produces: 数据文件副本 + 反汇编
    evidence_level: A
    degrade: optional

  vgmstream:
    name: vgmstream
    kind: cli
    repo: vgmstream/vgmstream
    license: LGPL / MIT 混合
    purpose: 游戏音频流解码 —— **数百种**游戏编码与循环信息
    exe: vgmstream-cli
    identity:
      version_args: [--version]
      version_contains: [vgmstream]
    install:
      manual: https://github.com/vgmstream/vgmstream
    produces: PCM + 循环信息
    evidence_level: A
    degrade: optional
    note: "覆盖 ADX/DSP ADPCM/PSX VAG/XMA/HCA/Opus/Vorbis 等。 ⚠️ **不能**复现游戏内重采样、滤波、音量与 DSP —— 门禁应验事件与调度"

  # ---------- F 输入 ----------
  sdl:
    name: SDL
    kind: cli
    repo: libsdl-org/SDL
    license: zlib
    purpose: 跨平台输入抽象（SDL_GameController / SDL_Joystick）
    exe: sdl2-config
    identity:
      version_args: [--version]
      version_contains: [2]
    install:
      apt: apt-get install -y libsdl2-dev
    produces: 输入抽象
    evidence_level: B
    degrade: optional
    note: SDL_GameControllerDB 输出 `GUID,name,mapping,platform`，兼容 SDL 2.0.10+

  antimicrox:
    name: AntiMicroX
    kind: cli
    repo: AntiMicroX/antimicrox
    license: GPLv3
    purpose: 键鼠到手柄重映射（GUI）
    exe: antimicrox
    identity:
      version_args: [--version]
    install:
      apt: apt-get install -y antimicrox
    produces: 映射配置
    evidence_level: C
    degrade: optional

  # ---------- G 音频 ----------
  openal_soft:
    name: OpenAL Soft
    kind: cli
    repo: kcat/openal-soft
    license: LGPL-2.1
    purpose: 跨平台软件音频基线（HRTF/距离衰减/多普勒/EFX 混响/Ambisonics/loopback）
    exe: openal-info
    identity:
      version_args: [--version]
      version_contains: [OpenAL]
    install:
      apt: apt-get install -y libopenal-dev
    produces: 音频输出 / WAV writer
    evidence_level: A
    degrade: optional
    note: 作为**软件基线**；FMOD/Wwise 若持合法授权应从原工程导出事件/bus/参数/快照/DSP

  # ========= 第八轮：运行时取证 / 二进制覆盖 / AI 门禁 =========

  # ---------- A 运行时取证 ----------
  frida:
    name: Frida
    kind: cli
    repo: frida/frida
    license: 多数组件为 LGPL-2.1 / wxWindows，部分工具 MIT（**按子组件确认**）
    purpose: "**跨平台动态插桩主入口**（黑盒注入脚本、钩任意函数、监视私有代码）"
    exe: frida
    identity:
      version_args: [--version]
      version_contains: [frida]
      subcommand: --help
    install:
      pip: pip install frida-tools
    wrapper: (见 scripts/runtime_forensics.py)
    produces: 探针样本（入参/出参/副作用/monotonic 时间戳）
    evidence_level: A
    degrade: required
    note: "支持 Win/macOS/Linux/Android/iOS/FreeBSD/QNX。 ⚠️ **Frida 脚本不得修改状态后声称观察到原版** —— 只读与受控桩必须分开。 移动端/DRM 场景采样失败要以**失败计数**收口，不能以\"脚本运行成功\"替代覆盖"

  qiling:
    name: Qiling Framework
    kind: cli
    repo: qilingframework/qiling
    license: GPLv2
    purpose: "**完整执行环境**模拟（可执行文件加载/动态链接/系统调用/IO/异常钩子）"
    exe: python3
    identity:
      version_args: [-c, "import qiling; print('QILING_OK')"]
      version_contains: [QILING_OK]
    install:
      pip: pip install qiling
    produces: 隔离复现的函数行为
    evidence_level: A
    degrade: optional
    note: "支持 PE/ELF/Mach-O、Win/Linux/macOS/Android/BSD。 适合答「给定环境和文件系统时这个原版子程序返回什么」"

  unicorn:
    name: Unicorn Engine
    kind: cli
    repo: unicorn-engine/unicorn
    license: GPLv2
    purpose: "**只模拟 CPU** —— 把已恢复状态放入单元测试验算法片段"
    exe: python3
    identity:
      version_args: [-c, "import unicorn; print('UNICORN_OK')"]
      version_contains: [UNICORN_OK]
    install:
      pip: pip install unicorn
    produces: 纯逻辑片段执行结果
    evidence_level: A
    degrade: optional
    note: ⚠️ **不理解动态库/系统调用/可执行格式** —— 与 Qiling 分工不同

  dynamorio:
    name: DynamoRIO
    kind: cli
    repo: DynamoRIO/dynamorio
    license: BSD-3-Clause（**按仓库确认**）
    purpose: 运行时代码操纵（函数/指令追踪、覆盖率、内存追踪、缓存模拟）
    exe: drrun
    identity:
      version_args: [--version]
    install:
      manual: https://dynamorio.org/
    produces: 细粒度追踪
    evidence_level: A
    degrade: optional
    note: Frida 不能稳定附加时的后手，**不是通用替代品**

  bpftrace:
    name: bpftrace
    kind: cli
    repo: bpftrace/bpftrace
    license: Apache-2.0
    purpose: 临时 eBPF 追踪（Linux）
    exe: bpftrace
    identity:
      version_args: [--version]
      version_contains: [bpftrace]
    install:
      apt: apt-get install -y bpftrace
    produces: 追踪输出
    evidence_level: B
    degrade: optional
    note: "低开销结构化追踪用 **LTTng**；Windows 原版应映射为 **ETW/WPR**， **不许宣称 eBPF 可直接观察 Windows**"

  # ---------- B 二进制 diff 与符号执行 ----------
  bindiff:
    name: BinDiff
    kind: cli
    repo: google/bindiff
    license: Apache-2.0
    purpose: 函数级二进制 diff（识别相同/相似/改名函数）
    exe: bindiff
    identity:
      version_args: [--version]
    install:
      manual: https://github.com/google/bindiff/releases
    produces: 函数匹配（含相似度与置信度）
    evidence_level: A
