# CI · 全部门禁（模板）

> **为什么进 CI**：门禁只在本地跑等于没有门禁。
> 每次提交都应重跑**所有可自动判定的门禁**，结果写进版本库。

```yaml
name: replication-gates

on: [push, pull_request]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 一键门禁（硬门禁阻断即失败）
        run: python3 scripts/run_all_gates.py --work work/ --strict

      - name: 列出人工门禁（提示，不阻断）
        if: always()
        run: python3 scripts/run_all_gates.py --list
```

## 门禁矩阵（自动判定）

| 门禁 | 脚本 | 硬/软 |
|---|---|---|
| G1 台账 100% 精读 | `ledger.py --check` | 硬 |
| G2 unknown 清零 | `coverage_gate.py --gate` | 硬 |
| G3 编号未重排 | `renumber_check.py` | 硬 |
| G4 括号平衡 | `brace_check.py` | 硬 |
| G5 config 字段差集 | `config_field_diff.py --gate` | 硬 |
| G6 跨端契约四类 | `cross-end-check.mjs --strict` | 硬 |
| G11 BUG 分诊 | `bug_triage.py --gate` | 硬 |
| G15 体验参数无缺失 | `param_extract.py --compare --gate` | 硬 |
| G16 资产无悬空引用 | `asset_inventory.py --gate` | 硬 |
| G17 许可四态无阻断 | `license_gate.py --gate` | 硬 |
| G18 无丢失文案 | `text_extract.py --compare --gate` | 硬 |
| G22 动效时序 | `motion_check.py --compare --gate` | 软 |

**一次命令跑完**：`python3 scripts/run_all_gates.py --work work/ --strict`

## 人工门禁（CI 判不了，必须由人签字）

| 门禁 | 内容 |
|---|---|
| G7 | golden 人工批准（**禁止 AI 代签**） |
| G8 | 故障注入 F1-F4 全命中 |
| G9 | 视觉逐张签字（design + domain_owner） |
| G10 | 等价性三层齐备 |
| G12 | 契约冻结（禁止手编与 bulk re-record） |
| G13 | 解析失败已登记 |
| G14 | mutation 存活=0 |
| G19 | C1-C12 无空类 + 六个必须实测 |
| G20 | 原版每状态有 A 级证据 |
| G21 | 许可证据充分（法务签字） |

## 三条铁律

1. **自动门禁全绿 ≠ 可以收工** —— 人工门禁一项没签字就不得声明完成
2. **门禁结果写进版本库** —— 不写等于没跑
3. **收工不由模型自述决定** —— 由脚本统计 + 人工签字共同决定

## 首次接入前必做

**故障注入验证**：故意写错参数名、删 DTO 字段、加必传参数、删注册，
确认脚本**四类全部报错**。
**先证明门禁会红，再信它绿** —— 否则它可能永远绿。
